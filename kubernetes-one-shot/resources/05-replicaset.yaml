# ReplicaSet
# - Ensures that a specified number of matching Pods are running.
# - Deployment normally manages ReplicaSets for you.
# - Usually create a Deployment rather than a ReplicaSet directly.

apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs
  namespace: interview-demo
  labels:
    app: nginx

spec:
  replicas: 3

  # ReplicaSet manages Pods matching this selector.
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
