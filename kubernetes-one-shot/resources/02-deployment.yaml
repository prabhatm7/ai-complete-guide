# Deployment
# - Manages a set of Pods.
# - Creates/updates ReplicaSets and supports rolling updates and rollbacks.
# - Usually the preferred resource for stateless applications.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: interview-demo
  labels:
    app: nginx

spec:
  # Desired number of Pods.
  replicas: 3

  # Tells the Deployment which Pods it owns.
  selector:
    matchLabels:
      app: nginx

  # Template used to create each Pod.
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80

          # Readiness: should this Pod receive traffic?
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          # Liveness: should this container be restarted?
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

          # Resource requests influence scheduling; limits constrain usage.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

  # Rolling update configuration.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
