# CronJob
# - Runs a Job on a schedule.
# - Useful for recurring work: backups, reports, cleanup, etc.
# - "0 2 * * *" = every day at 02:00.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-cleanup
  namespace: interview-demo

spec:
  schedule: "0 2 * * *"

  # Do not start a new Job if the previous one is still running.
  concurrencyPolicy: Forbid

  # Keep limited Job history.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # CronJob creates a Job from this template.
  jobTemplate:
    spec:
      completions: 1

      template:
        metadata:
          labels:
            app: daily-cleanup
        spec:
          # Jobs normally use OnFailure or Never.
          restartPolicy: OnFailure

          containers:
            - name: cleanup
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - echo "Running cleanup"; date
